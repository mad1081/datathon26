# Local vLLM server + this app on one machine; no cloud AI.
#   MODEL=Qwen/Qwen3-VL-30B-A3B-Instruct API_KEY=secret docker compose up -d --build
services:
  vllm:
    image: vllm/vllm-openai:v0.31.0
    command: >
      ${MODEL}
      --max-model-len 65536
      --limit-mm-per-prompt '{"image":256,"video":0}'
      --max-num-seqs 8
      --gpu-memory-utilization 0.90
    volumes: ["./models:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    ipc: host
  app:
    build: .
    environment:
      API_KEY: ${API_KEY:-change-me}
      VLM_BASE_URL: http://vllm:8000/v1
      VLM_MODEL: ${MODEL}
      DISABLE_THINKING: ${DISABLE_THINKING:-0}
      N_SAMPLES: ${N_SAMPLES:-1}
    volumes: ["./var:/data"]
    ports: ["8000:8000"]
    depends_on: [vllm]
