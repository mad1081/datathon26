анкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил;`}]},R231_19_3_5:{act:`R231`,clause:`п. 19 пп. 3)–5)`,parts:[{label:`пп. 3)`,z:`z446`,text:`проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися образцами подписей;`},{label:`пп. 4)`,z:`z447`,text:`сверяет соответствие суммы, указанной в приходном кассовом документе, с общей суммой фактически принятых наличных денег;`},{label:`пп. 5)`,z:`z448`,text:`подписывает все экземпляры приходного кассового документа, проставляет штамп кассового работника банка на всех экземплярах приходного кассового документа;`}]},R231_19_6:{act:`R231`,clause:`п. 19 пп. 6)`,parts:[{label:``,z:`z449`,text:`выдает клиенту документ, подтверждающий проведение кассовой операции по приему наличных денег.`}]},R231_20_1:{act:`R231`,clause:`п. 20 ч. 1`,parts:[{label:``,z:`z111`,text:`Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.`}]},R231_20_2:{act:`R231`,clause:`п. 20 ч. 2`,parts:[{label:``,z:`z112`,text:`На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).`}]},R231_21:{act:`R231`,clause:`п. 21`,parts:[{label:``,z:`z113`,text:`В случае если клиент вносит наличные деньги в кассу банка по нескольким приходным кассовым документам, кассовый работник принимает наличные деньги по каждому приходному кассовому документу отдельно.`}]},R231_22:{act:`R231`,clause:`п. 22`,parts:[{label:``,z:`z114`,text:`Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.`}]},R231_23:{act:`R231`,clause:`п. 23`,parts:[{label:``,z:`z115`,text:`Принятые в течение рабочего дня наличные деньги кассовый работник формирует, упаковывает и сдает по приходным кассовым документам заведующему кассой или лицу, осуществляющему функции заведующего кассой, в порядке, установленном внутренними документами банка.`},{label:`ч. 2`,z:`z116`,text:`Допускается передача принятых наличных денег заведующему кассой или лицу, осуществляющему функции заведующего кассой, в течение рабочего дня несколько раз.`}]},R231_24_1:{act:`R231`,clause:`п. 24 пп. 1)`,parts:[{label:``,z:`z119`,text:`проверяет указание на препроводительном документе необходимых сведений, предусмотренных пунктом 106 Правил;`}]},R231_24_2:{act:`R231`,clause:`п. 24 пп. 2)`,parts:[{label:``,z:`z120`,text:`осуществляет регистрацию суммы принимаемых наличных денег в порядке, установленном внутренними документами банка;`}]},R231_24_3_4:{act:`R231`,clause:`п. 24 пп. 3)–4)`,parts:[{label:`пп. 3)`,z:`z121`,text:`проверяет целостность сумки;`},{label:`пп. 4)`,z:`z122`,text:`проверяет правильность пломбирования сумки.`}]},R231_25:{act:`R231`,clause:`п. 25`,parts:[{label:``,z:`z123`,text:`В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности.`},{label:`ч. 2`,z:`z124`,text:`При обнаружении недостачи или излишка составляется акт о результатах пересчета для принятия мер по выявлению причин недостачи или излишков в порядке, установленном внутренними документами банка.`}]},R231_31_1:{act:`R231`,clause:`п. 31 пп. 1)`,parts:[{label:``,z:`z451`,text:`проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность, либо данным, подтверждающим (идентифицирующим) личность клиента, полученным посредством сервиса цифровых документов;`}]},R231_31_2:{act:`R231`,clause:`п. 31 пп. 2)`,parts:[{label:``,z:`z452`,text:`проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися образцами подписей;`}]},R231_31_3:{act:`R231`,clause:`п. 31 пп. 3)`,parts:[{label:``,z:`z453`,text:`подготавливает сумму наличных денег, подлежащую выдаче;`}]},R231_31_4:{act:`R231`,clause:`п. 31 пп. 4)`,parts:[{label:``,z:`z454`,text:`пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги;`}]},R231_31_5_6:{act:`R231`,clause:`п. 31 пп. 5)–6)`,parts:[{label:`пп. 5)`,z:`z455`,text:`подписывает все экземпляры расходного кассового документа и проставляет штамп кассового работника банка на всех экземплярах расходного кассового документа;`},{label:`пп. 6)`,z:`z456`,text:`выдает клиенту документ, подтверждающий проведение кассовой операции по выдаче наличных денег.`}]},R231_32:{act:`R231`,clause:`п. 32`,parts:[{label:``,z:`z150`,text:`Кассовый работник выдает клиенту банкноты полными, неполными пачками и (или) отдельными корешками банкнот по обозначенным на упаковке суммам без полистного пересчета при условии сохранения неповрежденной упаковки. Банкноты из неполных, а также поврежденных корешков выдаются кассовым работником полистным пересчетом.`}]},R231_42:{act:`R231`,clause:`п. 42`,parts:[{label:``,z:`z163`,text:`Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником в присутствии контролирующего работника, за исключением случаев совершения кассовых операций по приему и выдаче наличных денег клиенту.`}]},R231_43:{act:`R231`,clause:`п. 43`,parts:[{label:``,z:`z164`,text:`Сортировка наличных денег осуществляется по номиналам и по степени износа. Банкноты сортируются по номиналам, на годные к обращению, ветхие, изъятые и (или) изымаемые из обращения.`}]},R231_74:{act:`R231`,clause:`п. 74`,parts:[{label:``,z:`z220`,text:`Банки обеспечивают хранение наличных денег в кладовых и (или) сейфовой комнате после их учета в автоматизированной цифровой системе в соответствии с внутренними документами банка.`}]},R231_75:{act:`R231`,clause:`п. 75`,parts:[{label:``,z:`z221`,text:`Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег.`}]},R231_76:{act:`R231`,clause:`п. 76`,parts:[{label:``,z:`z222`,text:`Ключи и (или) коды электронных и механических замков от двери кладовой и (или) сейфовой комнаты банка хранятся у лиц, ответственных за сохранность наличных денег.`}]},R231_77:{act:`R231`,clause:`п. 77`,parts:[{label:``,z:`z223`,text:`Наличные деньги в кладовой и (или) сейфовой комнате хранятся раздельно по виду валюты, по номиналам банкнот и монет в металлических шкафах, стеллажах, сейфах, тележках.`}]},R231_78:{act:`R231`,clause:`п. 78`,parts:[{label:``,z:`z224`,text:`Перед закрытием кладовой и (или) сейфовой комнаты лица, ответственные за сохранность наличных денег, проверяют соответствие фактического наличия в кладовой и (или) сейфовой комнате наличных денег остатку кассы и данным бухгалтерского учета.`}]},R14_21:{act:`R14`,clause:`п. 21`,parts:[{label:``,z:`z90`,text:`Для осуществления инкассации банкнот, монет и ценностей оборудуется помещение бокса, примыкающее к входу кассового узла, с закрывающейся на замок дверью либо погрузочно-разгрузочная площадка.`}]}},nm=e=>em[tm[e].act].url+`#`+tm[e].parts[0].z,rm={R231:{short:`Правила № 231`,number:`Постановление Правления Национального Банка РК от 29 ноября 2019 года № 231 (рег. № 19680)`,url:`https://adilet.zan.kz/rus/docs/V1900019680`},R14:{short:`Правила № 14`,number:`Постановление Правления Национального Банка РК от 24 февраля 2020 года № 14 (рег. № 20075)`,url:`https://adilet.zan.kz/rus/docs/V2000020075`},ARDFM21:{short:`Инструкция АРРФР № 21`,number:`Постановление Правления АРРФР от 30 апреля 2024 года № 21 (рег. № 34348)`,url:`https://adilet.zan.kz/rus/docs/V2400034348`},R49:{short:`Правила № 49`,number:`Постановление Правления Национального Банка РК от 4 апреля 2019 года № 49 (рег. № 18545)`,url:`https://adilet.zan.kz/rus/docs/V1900018545`}},im=[{id:`cash_unattended`,name_ru:`Наличные/ценности оставлены без присмотра`,visual_criteria:`Кассир выходит из помещения или отходит от рабочего места, а на столе, счётной машине, тумбе или шкафу остаются наличные деньги, инкассаторская сумка или пачки банкнот; либо в пустом помещении наличные/сумка уже лежат открыто без сотрудника.`,negatives:`Не утверждать, что деньги пропали или похищены; не утверждать сумму. Не считать нарушением, если деньги убраны в закрытый ящик/сейф перед уходом.`,citations:[{act:`R231`,clause:`п. 20 ч. 2`,quote:`На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z112`},{act:`R231`,clause:`п. 22`,quote:`Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z114`}],strength:`strong`,has_solid_clause:!0,threshold:.6,count_in_verdict:!0},{id:`seals_docs_unattended`,name_ru:`Пломбы, штампы, ключи или кассовые документы оставлены без присмотра`,visual_criteria:`Кассир уходит, оставив на столе пломбы, пломбиратор, штамп, ключи или открытую папку с документами, при этом наличных на столе не видно.`,negatives:`Не утверждать, что документы содержат конфиденциальные данные; не утверждать, что ключи от хранилища. Норма отсылает к внутренним документам банка — формулировать как «признак возможного нарушения».`,citations:[{act:`R231`,clause:`п. 80`,quote:`Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z226`}],strength:`weak`,has_solid_clause:!1,threshold:.7,count_in_verdict:!0,note:`Прямого запрета в акте нет — только отсылка к внутренним документам банка (п. 80). В обучающих видео такие эпизоды есть, поэтому тип оставлен в детекции. Видео: X-24 (папка и пломбы на столе).`},{id:`safe_left_open`,name_ru:`Сейф/хранилище оставлен открытым`,visual_criteria:`Дверца сейфа или металлического шкафа открыта, и кассир уходит/отворачивается надолго; открытый сейф остаётся без присмотра или рядом проходит посторонний.`,negatives:`Не считать нарушением кратковременное открытие сейфа, когда кассир стоит рядом и сразу закрывает. Не утверждать содержимое сейфа, если его не видно.`,citations:[{act:`R231`,clause:`п. 20 ч. 2`,quote:`Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z112`},{act:`R231`,clause:`п. 80`,quote:`Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z226`}],strength:`medium`,has_solid_clause:!0,threshold:.6,count_in_verdict:!0},{id:`door_left_open`,name_ru:`Дверь кассы/кассового узла оставлена открытой`,visual_criteria:`Дверь в кассовое помещение остаётся открытой (распахнута, приоткрыта, не закрыта после выхода/входа) заметное время, особенно когда в помещении есть наличные или никого нет.`,negatives:`Не утверждать, что дверь не заперта на замок, если виден только закрытый проём. Кратковременное открытие при проходе не является нарушением.`,citations:[{act:`R14`,clause:`п. 8 ч. 1`,quote:`Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом.`,url:`https://adilet.zan.kz/rus/docs/V2000020075#z49`},{act:`R14`,clause:`п. 16 пп. 1) (переходная редакция до 01.01.2027)`,quote:`каждая касса имеет отдельный вход с закрывающейся на замок дверью`,url:`https://adilet.zan.kz/rus/docs/V2000020075#z121`}],strength:`medium`,has_solid_clause:!0,threshold:.65,count_in_verdict:!0,note:`Нормы об устройстве помещений, а не о поведении кассира. Правила № 14 п. 16 пп. 1): текст переходной редакции совпадает с редакцией пост. № 88, действующей с 01.01.2027.`},{id:`outsider_in_cash_room`,name_ru:`Постороннее лицо в кассовом помещении / за стойкой`,visual_criteria:`В кассовое помещение входит или находится человек, не являющийся кассиром/инкассатором при исполнении (в т.ч. второй клиент во время обслуживания первого), проходит за стойку, к сейфу или к рабочему месту кассира.`,negatives:`НЕ идентифицировать личность, не распознавать лица. Для ракурса, где клиенты штатно сидят в помещении рядом с кассиром (камера за спиной кассира), обслуживаемый клиент сам по себе не является посторонним. Инкассатор, передающий сумку, не является посторонним.`,citations:[{act:`R14`,clause:`п. 8 ч. 1`,quote:`Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом.`,url:`https://adilet.zan.kz/rus/docs/V2000020075#z49`},{act:`R231`,clause:`п. 75`,quote:`Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z221`},{act:`ARDFM21`,clause:`п. 16 пп. 4)`,quote:`охрана расчетно-кассового отделения, защита критических зон, в том числе исключение бесконтрольного пребывания на них посторонних лиц`,url:`https://adilet.zan.kz/rus/docs/V2400034348#z80`}],strength:`medium`,has_solid_clause:!0,threshold:.65,count_in_verdict:!0,note:`Прямого запрета посторонних именно в кассе в Правилах № 231 нет (п. 75 — про кладовую/сейфовую комнату). Инструкция АРРФР применяется к РКО вместимостью от 200 человек. Инструкция АРРФР № 21 п. 16 пп. 4) — пункт о договоре с охраной.`},{id:`cash_out_of_view`,name_ru:`Операции с наличными/сумкой вне зоны видеонаблюдения (под столом)`,visual_criteria:`Кассир опускает наличные или инкассаторскую сумку под стол, на колени, за корпус так, что руки с ценностями пропадают из кадра на несколько секунд, затем возвращает или убирает.`,negatives:`Не утверждать хищение; не утверждать, что деньги спрятаны в карман, если этого не видно. Убирание в ящик стола, который виден в кадре, — не нарушение.`,citations:[{act:`R14`,clause:`п. 16 пп. 6) (переходная редакция до 01.01.2027)`,quote:`касса оборудуется видеокамерами системы видеонаблюдения`,url:`https://adilet.zan.kz/rus/docs/V2000020075#z127`},{act:`R231`,clause:`п. 20 ч. 1`,quote:`Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z111`},{act:`R49`,clause:`п. 11 пп. 2) (по аналогии)`,quote:`при этом в зоне видимости видеонаблюдения находятся рабочая зона кассира и клиент`,url:`https://adilet.zan.kz/rus/docs/V1900018545#z1885`}],strength:`weak`,has_solid_clause:!1,threshold:.65,count_in_verdict:!0,note:`Прямого запрета работать вне камеры для БВУ не найдено; основание косвенное. Тип часто встречается в обучающих видео, поэтому оставлен в детекции. Видео: X-44 (метка 16 с; по video_notes «lowers cash under desk»).`},{id:`collector_bag_no_check`,name_ru:`Приём инкассаторской сумки без проверки документа/пломбы`,visual_criteria:`Инкассатор передаёт сумку, кассир принимает её и сразу убирает/вскрывает, не осматривая пломбу и шов и не сверяя сопроводительный документ.`,negatives:`Не утверждать, что пломба повреждена или поддельна. Если осмотр пломбы виден (кассир вертит сумку, смотрит на пломбу) — не нарушение.`,citations:[{act:`R231`,clause:`п. 24 ч. 2 пп. 4)`,quote:`проверяет правильность пломбирования сумки.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z122`},{act:`R231`,clause:`п. 24 ч. 2 пп. 3)`,quote:`проверяет целостность сумки`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z121`},{act:`R231`,clause:`п. 24 ч. 2 пп. 1)`,quote:`проверяет указание на препроводительном документе необходимых сведений, предусмотренных пунктом 106 Правил`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z119`}],strength:`strong`,has_solid_clause:!0,threshold:.6,count_in_verdict:!0},{id:`cash_within_client_reach`,name_ru:`Наличные оставлены в зоне досягаемости клиента`,visual_criteria:`Пересчитанные/принятые наличные лежат на краю стола или у окна рядом с клиентом, а кассир отворачивается (к сейфу, компьютеру) или отходит; клиент может взять деньги.`,negatives:`Не утверждать умысел клиента. Выдача денег клиенту после пересчёта — не нарушение.`,citations:[{act:`R231`,clause:`п. 20 ч. 2`,quote:`На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z112`},{act:`R231`,clause:`п. 22`,quote:`Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z114`}],strength:`medium`,has_solid_clause:!0,threshold:.6,count_in_verdict:!0},{id:`counting_without_client`,name_ru:`Пересчёт наличных не в присутствии клиента`,visual_criteria:`Клиент передаёт наличные и уходит до того, как кассир их пересчитал; пересчёт (вручную или на машине) происходит после ухода клиента.`,negatives:`Не утверждать расхождение суммы.`,citations:[{act:`R231`,clause:`п. 20 ч. 1`,quote:`Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z111`}],strength:`strong`,has_solid_clause:!0,threshold:.6,count_in_verdict:!0},{id:`issue_without_count`,name_ru:`Выдача наличных без пересчёта в присутствии клиента`,visual_criteria:`Кассир передаёт клиенту вскрытую/неполную пачку или россыпь банкнот без видимого пересчёта (рукой или машиной) перед клиентом.`,negatives:`Целая банковская пачка в неповреждённой упаковке может выдаваться без полистного пересчёта (п. 32) — не нарушение.`,citations:[{act:`R231`,clause:`п. 31 пп. 4)`,quote:`пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z454`}],strength:`medium`,has_solid_clause:!0,threshold:.75,count_in_verdict:!0},{id:`phone_or_personal_items`,name_ru:`Смартфон / личные вещи на рабочем месте кассира`,visual_criteria:`Кассир пользуется смартфоном (держит, смотрит, печатает) на рабочем месте, особенно при открытых наличных; или кладёт на рабочий стол личную сумку/кошелёк/верхнюю одежду.`,negatives:`Не утверждать содержимое экрана или переписки. Служебный стационарный телефон/гарнитура — не нарушение.`,citations:[{act:`R231`,clause:`п. 12 ч. 1`,quote:`Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z81`},{act:`R231`,clause:`п. 12 ч. 2`,quote:`Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z490`}],strength:`strong`,has_solid_clause:!0,threshold:.6,count_in_verdict:!0},{id:`safe_opened_with_client`,name_ru:`Открытие сейфа в присутствии клиента/постороннего`,visual_criteria:`Кассир открывает сейф (в т.ч. напольный) или достаёт из него наличные, когда рядом находится клиент или посторонний, видящий содержимое/код.`,negatives:`Не утверждать, что клиент увидел код или содержимое. Прямой нормы нет — формулировать осторожно.`,citations:[{act:`R231`,clause:`п. 80`,quote:`Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z226`}],strength:`weak`,has_solid_clause:!1,threshold:.8,count_in_verdict:!1,note:`Прямой нормы, запрещающей открывать сейф при клиенте, в проверенных актах не найдено; п. 80 — отсылка к внутренним документам. В размеченном X-19 сейф открывается при сидящем клиенте с меткой «без нарушения» — тип выводится только как наблюдение и не влияет на вердикт.`},{id:`eating_drinking`,name_ru:`Приём пищи/напитков на рабочем месте кассира`,visual_criteria:`Кассир ест или пьёт на рабочем месте: на столе еда (печенье и т. п.), кассир подносит стакан/кружку ко рту.`,negatives:`Прямой нормы о приёме пищи в актах РК нет — формулировать как признак нарушения внутреннего порядка, основание косвенное (п. 12: личные вещи хранятся вне кассового узла).`,citations:[{act:`R231`,clause:`п. 12 ч. 1 (косвенно)`,quote:`Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z81`},{act:`R231`,clause:`п. 12 ч. 2 (косвенно)`,quote:`Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z490`}],strength:`weak`,has_solid_clause:!1,threshold:.65,count_in_verdict:!0,note:`Размеченное X-46 (пьёт из стакана, печенье на столе) — «нарушение», поэтому тип учитывается в вердикте. Норма косвенная: прямого запрета нет. п. 12 ч. 2 перечисляет, что можно вносить в кассовый узел (лекарства, медизделия, средства связи без камеры); еды и напитков в перечне нет — основание косвенное.`},{id:`no_client_id_check`,name_ru:`Приём наличных без предъявления документа, удостоверяющего личность`,visual_criteria:`Клиент подходит и передаёт наличные, кассир принимает и пересчитывает их, но клиент не передаёт и не показывает удостоверение/карту, кассир не смотрит документ и не сверяет его на экране. В эталонном видео той же сцены клиент сначала кладёт на стол удостоверение.`,negatives:`Не распознавать лицо и не утверждать личность клиента. Если документ мог быть показан вне кадра или ранее — снижать уверенность. Инкассатор с сумкой — отдельный тип collector_bag_no_check.`,citations:[{act:`R231`,clause:`п. 19 пп. 1)`,quote:`проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z444`}],strength:`medium`,has_solid_clause:!0,threshold:.7,count_in_verdict:!0,note:`Видео: X-2 (нарушение) vs X-3 (эталон, карта на столе). Идентификация может пройти через сервис цифровых документов — поэтому порог повышен.`},{id:`foreign_cash_on_desk`,name_ru:`Наличные предыдущего клиента остаются на рабочем столе при обслуживании следующего`,visual_criteria:`После завершения операции пачка банкнот предыдущего клиента остаётся открыто лежать на столе (не убрана в сейф/ящик), а входит и обслуживается следующий клиент; деньги нового клиента раскладываются рядом.`,negatives:`Не утверждать сумму или чьи это деньги сверх видимого. Если пачка убрана в ящик/сейф до входа следующего клиента — не нарушение.`,citations:[{act:`R231`,clause:`п. 20 ч. 2`,quote:`На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z112`},{act:`R231`,clause:`п. 21`,quote:`В случае если клиент вносит наличные деньги в кассу банка по нескольким приходным кассовым документам, кассовый работник принимает наличные деньги по каждому приходному кассовому документу отдельно.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z113`}],strength:`strong`,has_solid_clause:!0,threshold:.6,count_in_verdict:!0,note:`Видео: X-4/X-47 (один файл, метки 57 и 68 с), X-38. Норма п. 20 ч. 2 прямо: на рабочем месте только деньги текущего клиента; п. 21 — вспомогательная.`},{id:`cash_accepted_without_count`,name_ru:`Наличные приняты/убраны без пересчёта`,visual_criteria:`Наличные (из сумки инкассатора или от клиента) сразу убираются в сейф/ящик без полистного пересчёта рукой или на счётной машине.`,negatives:`Целая банковская упаковка, принимаемая по надписям на ней, может не пересчитываться полистно — снижать уверенность. Не утверждать недостачу.`,citations:[{act:`R231`,clause:`п. 19 пп. 2)`,quote:`принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z445`}],strength:`strong`,has_solid_clause:!0,threshold:.65,count_in_verdict:!0,note:`Видео: X-13 (нарушение) vs X-14 (эталон с пересчётом).`},{id:`suspicious_note_returned`,name_ru:`Сомнительная банкнота возвращена клиенту без оформления`,visual_criteria:`Кассир отдельно рассматривает/откладывает купюру (на свет, в детекторе), после чего возвращает банкноты клиенту; заведующий не вызывается, акт не оформляется.`,negatives:`По видео нельзя установить, что купюра поддельная, — формулировать как признак. Возврат денег при отказе клиента от операции без признаков проверки купюры — не этот тип.`,citations:[{act:`R231`,clause:`п. 59 ч. 1`,quote:`При обнаружении сомнительных банкнот и монет кассовый работник в присутствии клиента и заведующего кассой или лица, осуществляющего его функции, составляет акт о приеме на экспертизу сомнительных банкнот и монет в двух экземплярах…`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z198`},{act:`R231`,clause:`п. 61`,quote:`Банкноты и монеты, имеющие признаки подделки, клиенту не возвращаются, сумма принятых банкнот и монет на банковский счет клиента не зачисляется.`,url:`https://adilet.zan.kz/rus/docs/V1900019680#z204`}],strength:`medium`,has_solid_clause:!0,threshold:.7,count_in_verdict:!0,note:`Видео: X-1 (метка 22 с).`},{id:`safe_key_left`,name_ru:`Ключ оставлен в замке сейфа/ящика`,visual_criteria:`Кассир закрывает или открывает сейф/ящик и отходит (выходит из помещения), а ключ остаётся торчать в замке.`,negatives:`Не утверждать, что сейф не заперт. Ключ в замке, пока кассир стоит рядом и работает с сейфом, — не нарушение.`,citations:[{act:`R231`,clause:`п. 80`,quote:`Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенны
