<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка кассовой дисциплины по видео</title>
<style>
  :root { --red:#c0392b; --green:#1e8449; --muted:#666; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; background:#f4f5f7; color:#222; }
  header { background:#7a0c2e; color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; opacity:.85; font-size:13px; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border-radius:10px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  input[type=text] { padding:8px; border:1px solid #ccc; border-radius:6px; min-width:260px; }
  button { background:#7a0c2e; color:#fff; border:0; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  #drop { border:2px dashed #bbb; border-radius:10px; padding:28px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:#7a0c2e; background:#fbf0f3; }
  progress { width:100%; height:14px; }
  .verdict { font-size:22px; font-weight:700; padding:14px 18px; border-radius:8px; }
  .verdict.bad { background:#fdecea; color:var(--red); }
  .verdict.ok { background:#e9f7ef; color:var(--green); }
  .verdict.err { background:#f1f1f1; color:#555; }
  .review { background:#fff6e0; color:#8a5a00; border-radius:6px; padding:8px 12px; margin-top:8px; }
  .tracks { margin:12px 0; font-size:12px; }
  .trow { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .tl { width:150px; color:var(--muted); }
  .tbar { position:relative; flex:1; height:12px; background:#f0f0f0; border-radius:3px; }
  .seg { position:absolute; top:0; bottom:0; background:#7a0c2e99; border-radius:3px; }
  .seg.gap { background:repeating-linear-gradient(45deg,#bbb,#bbb 4px,#eee 4px,#eee 8px); }
  .mark { position:absolute; top:-2px; width:3px; height:16px; background:var(--red); }
  .viol { border-left:4px solid var(--red); padding:10px 14px; margin:14px 0; background:#fffafa; border-radius:6px; }
  .obs { border-left:4px solid #e0a800; background:#fffdf5; }
  .viol h3 { margin:0 0 6px; font-size:17px; }
  .tc { font-family: ui-monospace, monospace; background:#eee; padding:2px 6px; border-radius:4px; }
  .frames { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .frames figure { margin:0; }
  .frames img { width:320px; max-width:100%; border-radius:6px; border:1px solid #ddd; cursor:zoom-in; }
  .frames figcaption { font-size:12px; color:var(--muted); text-align:center; }
  .cite { font-size:13px; background:#f7f7f9; border-radius:6px; padding:8px 10px; margin-top:8px; }
  .cite q { font-style:italic; }
  .muted { color:var(--muted); font-size:13px; }
  .badge { display:inline-block; font-size:11px; padding:2px 6px; border-radius:10px; background:#eee; margin-left:6px; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:9; }
  #lightbox img { max-width:95vw; max-height:95vh; }
  details { margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>AI-проверка кассовой дисциплины по видеозаписи</h1>
  <p>Локальный анализ. Распознавание лиц и звук не используются. Результат — признаки <b>возможных</b> нарушений для проверки человеком.</p>
</header>
<main>
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <label>API-ключ: <input type="text" id="key" placeholder="X-API-Key"></label>
    </div>
    <div id="drop">Перетащите видео (.mov, .mp4) сюда или нажмите для выбора файла
      <input type="file" id="file" accept=".mov,.mp4,.m4v,.avi,.mkv,video/*" hidden></div>
    <div class="row" style="margin-top:12px">
      <span id="fname" class="muted">Файл не выбран</span>
      <button id="go" disabled>Запустить анализ</button>
    </div>
  </div>
  <div class="card" id="statusCard" style="display:none">
    <div id="statusText">…</div>
    <progress id="prog" max="1" value="0"></progress>
  </div>
  <div id="result"></div>
</main>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>
<script>
const $ = s => document.querySelector(s);
const keyEl = $('#key');
keyEl.value = localStorage.getItem('apiKey') || "__UI_API_KEY__";
keyEl.onchange = () => localStorage.setItem('apiKey', keyEl.value);
let file = null;
const STAGES = {queued:'В очереди', started:'Запуск', decoding:'Декодирование видео', analyzing:'Анализ фрагментов моделью',
                refining:'Уточнение таймкода и кадров', done:'Готово'};
function pick(f){ file=f; $('#fname').textContent = f ? `${f.name} (${(f.size/1048576).toFixed(1)} МБ)` : 'Файл не выбран'; $('#go').disabled=!f; }
$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => pick(e.target.files[0]);
['dragover','dragenter'].forEach(ev => $('#drop').addEventListener(ev, e => {e.preventDefault(); $('#drop').classList.add('over');}));
['dragleave','drop'].forEach(ev => $('#drop').addEventListener(ev, e => {e.preventDefault(); $('#drop').classList.remove('over');}));
$('#drop').addEventListener('drop', e => pick(e.dataTransfer.files[0]));
function status(text, p){ $('#statusCard').style.display='block'; $('#statusText').textContent=text; $('#prog').value = p ?? 0; }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#go').onclick = () => {
  if (!file) return;
  $('#go').disabled = true; $('#result').innerHTML = '';
  const fd = new FormData(); fd.append('file', file);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/v1/analyze');
  xhr.setRequestHeader('X-API-Key', keyEl.value);
  xhr.upload.onprogress = e => e.lengthComputable && status(`Загрузка файла… ${Math.round(100*e.loaded/e.total)}%`, e.loaded/e.total*0.1);
  xhr.onload = () => {
    if (xhr.status !== 202 && xhr.status !== 200) { status('Ошибка загрузки: ' + xhr.status + ' ' + xhr.responseText, 0); $('#go').disabled=false; return; }
    const {job_id} = JSON.parse(xhr.responseText);
    poll(job_id, Date.now());
  };
  xhr.onerror = () => { status('Сетевая ошибка при загрузке', 0); $('#go').disabled=false; };
  xhr.send(fd);
};

async function poll(id, t0){
  const sec = Math.round((Date.now()-t0)/1000);
  let r, j = null;
  try {
    r = await fetch('/api/v1/jobs/' + id, {headers: {'X-API-Key': keyEl.value}});
    try { j = await r.json(); } catch (_) { j = null; }
  } catch (e) {
    // network hiccup: keep polling a little, never render a verdict
    if (sec < 600) { status(`Нет связи с сервером, повтор… · ${sec} с · задача ${id}`, $('#prog').value); setTimeout(() => poll(id, t0), 3000); return; }
    return showError(id, 'Сервер недоступен: ' + e.message);
  }
  if (!r.ok) {
    const msg = {401:'неверный или отсутствующий API-ключ (401)', 404:'задача не найдена (404)'}[r.status] || `ошибка сервера (${r.status})`;
    return showError(id, msg + (j?.detail ? ': ' + j.detail : ''));
  }
  if (!j || !j.status) return showError(id, 'некорректный ответ сервера');
  if (j.status === 'processing') { status(`Обработка: ${STAGES[j.stage]||j.stage||''} · ${sec} с · задача ${id}`, j.progress||0); setTimeout(() => poll(id, t0), 1500); return; }
  if (j.status === 'failed') return showError(id, 'ошибка обработки: ' + (j.error||''));
  if (j.status !== 'done' || (j.verdict !== 'violation' && j.verdict !== 'no_violation')) return showError(id, 'неожиданный статус задачи: ' + j.status);
  $('#go').disabled = false;
  status(`Готово за ${sec} с · задача ${id}`, 1);
  render(j);
}

function showError(id, msg){
  $('#go').disabled = false;
  status('Ошибка: ' + msg, 0);
  $('#result').innerHTML = `<div class="card"><div class="verdict err">Результат не получен</div><p>${esc(msg)}</p><p class="muted">Задача ${esc(id)}. Вердикт не показан — это не означает отсутствие нарушений.</p></div>`;
}

const TRACK_RU = {client_at_window:'Клиент у окна', cashier_at_desk:'Кассир на месте', cash_in_hands:'Деньги в руках', counting:'Пересчёт', second_employee:'Второй человек', phone:'Телефон'};
function tracksHtml(j){
  const d = j.meta?.duration_sec || 1, pct = x => (100*x/d).toFixed(2)+'%';
  const labels = [...new Set([...(j.tracks||[]).map(t=>t.label)])];
  const rows = labels.map(l => `<div class="trow"><span class="tl">${esc(TRACK_RU[l]||l)}</span><div class="tbar">${(j.tracks||[]).filter(t=>t.label===l).map(t=>`<div class="seg" style="left:${pct(t.start_sec)};width:${pct(t.end_sec-t.start_sec)}" title="${t.start_sec}–${t.end_sec} с"></div>`).join('')}</div></div>`);
  const gaps = (j.unanalyzed_ranges||[]);
  if (gaps.length) rows.push(`<div class="trow"><span class="tl">Не проанализировано</span><div class="tbar">${gaps.map(g=>`<div class="seg gap" style="left:${pct(g.start_sec)};width:${pct(g.end_sec-g.start_sec)}" title="${esc(g.reason)}"></div>`).join('')}</div></div>`);
  const marks = (j.violations||[]).map(v=>`<div class="mark" data-type-id="${esc(v.type_id)}" style="left:${pct(v.timecode_sec)}" title="${esc(v.type_name_ru||v.type)}"></div>`).join('');
  return rows.length ? `<div class="tracks">${rows.join('')}<div class="trow"><span class="tl">Нарушения</span><div class="tbar">${marks}</div></div></div>` : '';
}

// v.type — русское название (для людей и жюри), v.type_id — машинный ключ из rules.json (для логики UI)
function violationHtml(v, cls){
  const cites = (v.rule?.citations||[]).map(c => `<div class="cite"><b>${esc(c.short)}</b> — ${esc(c.act)}, <b>${esc(c.clause)}</b>: <q>${esc(c.quote)}</q><br><span class="muted">${esc(c.document||c.doc)}</span> · <a href="${esc(c.url)}" target="_blank" rel="noopener">adilet.zan.kz</a></div>`).join('')
      || `<div class="cite">Прямая норма в проверенных актах РК не найдена — требуется ручная проверка.</div>`;
  const frames = (v.evidence_frames||[]).map(f => `<figure><img src="data:image/jpeg;base64,${f.image_base64}" onclick="lb(this.src)" alt="кадр"><figcaption>${f.role==='peak'?'<b>момент события</b>':f.role==='before'?'до':'после'} · ${f.timestamp_sec.toFixed(2)} с · кадр №${f.frame_index}</figcaption></figure>`).join('');
  const strength = {strong:'сильное основание', medium:'среднее основание', weak:'косвенное основание', none:'нет нормы', unknown:'норма не определена'}[v.rule?.strength] || '';
  return `<div class="viol ${cls}" data-type-id="${esc(v.type_id)}"><h3>${esc(v.type_name_ru||v.type)} <span class="badge">${strength}</span> <span class="badge">уверенность ${(v.confidence*100).toFixed(0)}%</span></h3>
    <div>Таймкод: <span class="tc">${esc(v.timecode)}</span> (${v.timecode_sec} с, кадр №${v.frame_index})</div>
    <p><b>Что видно:</b> ${esc(v.observed)}</p>
    ${v.reason_not_counted ? `<p class="muted">Не учтено в вердикте: ${esc(v.reason_not_counted)}</p>`:''}
    <div class="frames">${frames}</div>${cites}
    <details><summary class="muted">Полное описание и ограничения</summary><p>${esc(v.description)}</p><p class="muted">Не утверждается по видео: ${esc(v.rule?.not_claimed)}</p></details></div>`;
}

function render(j){
  const bad = j.verdict === 'violation';
  let h = `<div class="card"><div class="verdict ${bad?'bad':'ok'}">${bad?'Обнаружены признаки возможных нарушений':'Нарушение не обнаружено'}</div>
           <p class="muted">Файл: ${esc(j.filename)} · модель: ${esc(j.meta?.model)} · длительность ${j.meta?.duration_sec} с · обработка ${j.meta?.processing_sec} с</p>`;
  if (j.needs_manual_review) h += `<div class="review">Нужна ручная проверка: ${esc((j.manual_review_reasons||[]).join('; ') || 'см. предупреждения')}</div>`;
  h += tracksHtml(j);
  if (j.meta?.warnings?.length) h += `<p style="color:#b9770e">⚠ ${j.meta.warnings.map(esc).join('<br>⚠ ')}</p>`;
  h += (j.violations||[]).map(v => violationHtml(v, '')).join('');
  if (j.observations?.length) h += `<h3>Наблюдения ниже порога (не влияют на вердикт)</h3>` + j.observations.map(v => violationHtml(v, 'obs')).join('');
  h += `<details><summary class="muted">JSON-ответ API</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(j, (k,v)=> k==='image_base64' ? v.slice(0,40)+'…' : v, 2))}</pre></details></div>`;
  $('#result').innerHTML = h;
}
function lb(src){ $('#lbimg').src = src; $('#lightbox').style.display='flex'; }
</script>
</body>
</html>
