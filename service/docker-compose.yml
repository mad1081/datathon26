# Recommended GPU deployment: local vLLM server (Apache-2.0) + this app (VLM_BACKEND=openai -> http://vllm:8000/v1).
# Everything runs on your own machine; no cloud AI.
#   API_KEY=secret docker compose up -d --build
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      --max-model-len 16384
      --limit-mm-per-prompt '{"image": 10}'
      --enable-prefix-caching
      --gpu-memory-utilization 0.90
    volumes: ["./models:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    ipc: host
  app:
    build: .
    environment:
      API_KEY: ${API_KEY:-change-me}
      VLM_BACKEND: openai
      OPENAI_BASE_URL: http://vllm:8000/v1
      OPENAI_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      WINDOW_CONCURRENCY: "6"
    volumes: ["./var:/data"]
    ports: ["8000:8000"]
    depends_on: [vllm]
